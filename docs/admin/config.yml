# ============================================================
#  Decap CMS configuratie — ELAN E-learning beheer
#  Hiermee bewerken invullers de inhoud via /admin/ zonder code.
# ============================================================

backend:
  name: github
  repo: ELAN-DCC/elan-elearning      # <-- AANPASSEN naar jouw organisatie/repo
  branch: main
  # Auth-helper (eenmalig instellen, zie README). Houdt alles binnen GitHub.
  base_url: https://elan-decap-auth.onrender.com   # <-- AANPASSEN naar jouw auth-helper URL

# Conceptmodus: wijzigingen komen eerst als 'concept' / 'ter review' /
# 'klaar', zodat jij regie houdt voordat iets live gaat.
publish_mode: editorial_workflow

# Geüploade afbeeldingen komen in de assets-map
media_folder: "docs/assets/uploads"
public_folder: "/assets/uploads"

# Nederlandse interface-teksten waar mogelijk
locale: "nl"

# ============================================================
#  Herbruikbare blokken: dit zijn de "tip/let-op/valkuil/code/
#  tekst/tabel"-blokken die je in elk subhoofdstuk kunt toevoegen.
#  (gedefinieerd via 'widget: list' met 'types' per subhoofdstuk)
# ============================================================

collections:
  # ----------------------------------------------------------
  # MODULES (de 8 fasen + welkom). Elke module = 1 bestand.
  # ----------------------------------------------------------
  - name: "modules"
    label: "Modules (fasen)"
    label_singular: "Module"
    description: "De hoofdpagina's van de e-learning: welkom + de 8 fasen."
    folder: "content/modules"
    create: true
    slug: "{{fields.volgorde}}-{{slug}}"
    identifier_field: titel
    summary: "{{fields.volgorde}} — {{titel}}"
    sortable_fields: ['volgorde', 'titel']
    fields:
      - { label: "Volgorde (00=welkom, 01..08=fasen)", name: "volgorde", widget: "string", hint: "Twee cijfers, bv. 03. Bepaalt de plek in het menu." }
      - { label: "Menutitel", name: "menutitel", widget: "string", hint: "Korte titel in het menu, bv. 'Fase 3 — Voorbereiding & toegang'." }
      - { label: "Paginatitel", name: "titel", widget: "string", hint: "De grote kop bovenaan de pagina." }
      - label: "Toon fase-voortgangsbalk?"
        name: "toon_balk"
        widget: "boolean"
        default: true
      - label: "Introductie 'Wat gebeurt er in deze fase?'"
        name: "intro"
        widget: "markdown"
        required: false
      - label: "'Wat heb je nodig?' (één punt per regel)"
        name: "benodigdheden"
        widget: "list"
        required: false
        field: { label: "Punt", name: "punt", widget: "string" }

      # ---- SUBHOOFDSTUKKEN: vrij toe te voegen en te herordenen ----
      - label: "Subhoofdstukken"
        name: "subhoofdstukken"
        label_singular: "Subhoofdstuk"
        widget: "list"
        required: false
        summary: "{{fields.subtitel}}"
        fields:
          - { label: "Titel subhoofdstuk", name: "subtitel", widget: "string" }

          # ---- BLOKKEN binnen een subhoofdstuk ----
          # Kies per blok een type: tekst, tip, let-op, valkuil, code,
          # tabel of inklapbaar. Sleep om te herordenen.
          - label: "Blokken"
            name: "blokken"
            label_singular: "Blok"
            widget: "list"
            types:
              - label: "Tekst"
                name: "tekst"
                widget: "object"
                fields:
                  - { label: "Tekst", name: "inhoud", widget: "markdown" }
              - label: "Tip (groen)"
                name: "tip"
                widget: "object"
                fields:
                  - { label: "Kop", name: "kop", widget: "string", default: "Tip" }
                  - { label: "Inhoud", name: "inhoud", widget: "markdown" }
              - label: "Let op (geel)"
                name: "letop"
                widget: "object"
                fields:
                  - { label: "Kop", name: "kop", widget: "string", default: "Let op" }
                  - { label: "Inhoud", name: "inhoud", widget: "markdown" }
              - label: "Valkuil (rood)"
                name: "valkuil"
                widget: "object"
                fields:
                  - { label: "Kop", name: "kop", widget: "string", default: "Valkuil" }
                  - { label: "Inhoud", name: "inhoud", widget: "markdown" }
              - label: "Nog aan te vullen (markering)"
                name: "todo"
                widget: "object"
                fields:
                  - { label: "Wat moet er nog komen?", name: "inhoud", widget: "markdown" }
              - label: "Codeblok (R / Python / etc.)"
                name: "code"
                widget: "object"
                fields:
                  - { label: "Taal", name: "taal", widget: "select", options: ["text","r","python","sql","bash"], default: "text" }
                  - { label: "Code", name: "inhoud", widget: "text" }
              - label: "Inklapbaar blok"
                name: "inklap"
                widget: "object"
                fields:
                  - { label: "Kop (klikbaar)", name: "kop", widget: "string" }
                  - { label: "Verborgen inhoud", name: "inhoud", widget: "markdown" }
              - label: "Tabel (Markdown)"
                name: "tabel"
                widget: "object"
                fields:
                  - { label: "Tabel in Markdown", name: "inhoud", widget: "text", hint: "Gebruik | kolom | kolom | met een --- scheidingsregel." }

      # ---- NASLAG-blok onderaan de module ----
      - label: "Naslag bij deze fase (één punt per regel)"
        name: "naslag"
        widget: "list"
        required: false
        field: { label: "Punt", name: "punt", widget: "markdown" }

  # ----------------------------------------------------------
  # NASLAG-PAGINA'S (FAQ, contactpersonen, scripts, checklists)
  # Vrij te bewerken als losse Markdown.
  # ----------------------------------------------------------
  - name: "naslag"
    label: "Naslagpagina's"
    label_singular: "Naslagpagina"
    description: "Contactpersonen, FAQ, checklists en scriptoverzicht."
    folder: "content/naslag"
    create: true
    identifier_field: titel
    fields:
      - { label: "Paginatitel", name: "titel", widget: "string" }
      - { label: "Bestandsnaam (slug)", name: "slug", widget: "string", hint: "bv. faq, contactpersonen, scripts, checklists" }
      - { label: "Inhoud", name: "body", widget: "markdown" }
