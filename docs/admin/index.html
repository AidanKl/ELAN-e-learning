<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>ELAN E-learning — Beheer</title>
  <link rel="icon" href="../assets/favicon.png" />
  <style>
    :root { --lumc: #003070; --lumc-licht: #DEEBF7; }
    body {
      margin: 0; font-family: Arial, sans-serif;
      background: var(--lumc-licht);
    }
    /* Wachtwoordscherm */
    #poort {
      position: fixed; inset: 0; display: flex;
      align-items: center; justify-content: center;
      background: var(--lumc-licht); z-index: 9999;
    }
    .kaart {
      background: #fff; border-radius: 10px;
      box-shadow: 0 6px 24px rgba(0,48,112,0.18);
      padding: 2.2em 2.4em; width: 320px; text-align: center;
    }
    .kaart img { height: 56px; margin-bottom: 1em; }
    .kaart h1 { font-size: 1.1rem; color: var(--lumc); margin: 0 0 0.4em; }
    .kaart p  { font-size: 0.85rem; color: #555; margin: 0 0 1.2em; }
    .kaart input[type=password] {
      width: 100%; box-sizing: border-box;
      padding: 0.65em 0.8em; font-size: 1rem;
      border: 2px solid var(--lumc); border-radius: 6px;
      margin-bottom: 0.9em; text-align: center;
    }
    .kaart button {
      width: 100%; padding: 0.65em; font-size: 1rem;
      background: var(--lumc); color: #fff; border: 0;
      border-radius: 6px; cursor: pointer; font-weight: 700;
    }
    .kaart button:hover { background: #00204D; }
    .fout { color: #B00020; font-size: 0.82rem; min-height: 1.2em; margin-top: 0.6em; }
    .schud { animation: schud 0.35s; }
    @keyframes schud {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
  </style>
</head>
<body>

  <!-- ============================================================
       WACHTWOORDSCHERM
       Het wachtwoord staat hieronder als 'HASH' (SHA-256), zodat het
       niet letterlijk leesbaar in de code staat. Wachtwoord wijzigen?
       1. Ga naar een SHA-256 generator (of browser-console:
          crypto.subtle) en maak de hash van je nieuwe wachtwoord.
       2. Vervang de HASH-waarde hieronder.
       Let op: dit is een eenvoudige drempel om nieuwsgierigen buiten
       de editor te houden — geen zware beveiliging. De echte
       schrijfbeveiliging komt later via de GitHub-koppeling (zie README).
       ============================================================ -->
  <div id="poort">
    <div class="kaart" id="kaart">
      <img src="../assets/logo-elan.png" alt="ELAN" />
      <h1>Beheeromgeving</h1>
      <p>Voer het beheerwachtwoord in om de editor te openen.</p>
      <form id="vorm">
        <input type="password" id="ww" placeholder="Wachtwoord" autofocus autocomplete="off" />
        <button type="submit">Openen</button>
        <div class="fout" id="fout"></div>
      </form>
    </div>
  </div>

  <script>
    // SHA-256 hash van het wachtwoord "ELAN"
    var HASH = "20bda7edd61859bd84b5010fec847059e47bb67b569eefafe322a9cd89f13c88";

    async function sha256(tekst) {
      var data = new TextEncoder().encode(tekst);
      var buf = await crypto.subtle.digest("SHA-256", data);
      return Array.from(new Uint8Array(buf))
        .map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");
    }

    function startCms() {
      document.getElementById("poort").remove();
      // Decap CMS pas laden ná het wachtwoord, zodat de editor
      // niet zichtbaar is zonder wachtwoord.
      var s = document.createElement("script");
      s.src = "https://unpkg.com/decap-cms@^3.3.3/dist/decap-cms.js";
      document.body.appendChild(s);
    }

    // Al eerder ingelogd in deze browsersessie? Direct door.
    if (sessionStorage.getItem("elan-admin") === "ok") startCms();

    document.getElementById("vorm").addEventListener("submit", async function (e) {
      e.preventDefault();
      var invoer = document.getElementById("ww").value;
      var hash = await sha256(invoer);
      if (hash === HASH) {
        sessionStorage.setItem("elan-admin", "ok");
        startCms();
      } else {
        var kaart = document.getElementById("kaart");
        document.getElementById("fout").textContent = "Onjuist wachtwoord.";
        kaart.classList.add("schud");
        setTimeout(function () { kaart.classList.remove("schud"); }, 400);
        document.getElementById("ww").value = "";
        document.getElementById("ww").focus();
      }
    });
  </script>
</body>
</html>
